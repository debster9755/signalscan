name: Security

# PRD §27.1 steps 9-10 and §22.1 ("Dependency and secret scanning in GitHub").
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so a newly-disclosed advisory in an unchanged dependency is still
    # caught rather than waiting for the next pull request.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit
        run: pnpm audit --audit-level moderate

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so a secret committed earlier and later removed is
          # still found — it is still in the objects, and still leaked.
          fetch-depth: 0
      # The gitleaks action derives its scan range from the push event
      # (`<before>^..<after>`), which has no valid parent on an initial push and
      # aborts having scanned zero bytes — a green-looking no-op at best, a hard
      # failure at worst. Running the binary directly scans the whole history
      # every time, which is what the fetch-depth above is for.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full history for committed secrets
        run: gitleaks detect --source . --redact --exit-code 1 --verbose

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    # Code scanning on a private repository needs GitHub Advanced Security.
    # Without it the analyze step fails with "Code scanning is not enabled for
    # this repository", so this is skipped rather than left permanently red.
    # It starts working the moment the repository is made public or GHAS is on.
    if: github.event.repository.visibility == 'public'
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
